<svg width="100%" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Pink Oyster Fruiting Chamber</title>
<desc>Cross-section of a 1m³ open fruiting cubicle with ceramic heater, USB fan, Pi camera, SHT31 sensor, ultrasonic atomizers in water reservoir, heating mat, and three elevated containers with pink oyster mushrooms.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e8f5e9"/>
    <stop offset="100%" stop-color="#dcedc8"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#bcaaa4"/>
    <stop offset="100%" stop-color="#8d6e63"/>
  </linearGradient>
  <linearGradient id="straw" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffe082"/>
    <stop offset="100%" stop-color="#fb8c00" stop-opacity="0.7"/>
  </linearGradient>
  <linearGradient id="mist" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="#80deea" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#80deea" stop-opacity="0.0"/>
  </linearGradient>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Chamber walls -->
<rect x="80" y="50" width="520" height="420" fill="url(#bg)" rx="6" stroke="#81c784" stroke-width="2"/>
<rect x="80" y="470" width="520" height="24" fill="url(#floor)" rx="0"/>
<rect x="80" y="50" width="520" height="8" fill="#a5d6a7" opacity="0.6"/>

<!-- LIGHT BAR -->
<rect x="240" y="46" width="200" height="14" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
<text x="340" y="37" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#e65100">12h light cycle</text>
<line x1="260" y1="60" x2="200" y2="160" stroke="#fff9c4" stroke-width="1.5" opacity="0.5"/>
<line x1="300" y1="60" x2="280" y2="160" stroke="#fff9c4" stroke-width="1.5" opacity="0.4"/>
